name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: downloads
          key: models-whisper-base-q51-qwen35-08b-q4km-amy-low-v1

      - name: Fetch models and sherpa-onnx AAR
        run: bash scripts/fetch_models.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
